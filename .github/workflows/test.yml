name: Tests
on:
  push:
    branches: ["feature/**", develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fieldsight
          POSTGRES_PASSWORD: fieldsight
          POSTGRES_DB: fieldsight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldsight"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fieldsight:fieldsight@localhost:5432/fieldsight_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      # numpy is for the scripts/ tools (multichannel_probe), not for any deployed
      # lambda — those get it from the VAD layer. Without it the probe tests fail to
      # IMPORT, which surfaces as a red suite unrelated to the change being tested.
      # python-docx is the same shape of problem one step later: the Word-export
      # tests open with `importorskip("docx")`, so without it they SKIP and the
      # suite is green over a path nothing checked. Keep this list identical to
      # the one in deploy-prod.yml — that one has been short an entry before, and
      # the miss showed up as `skipped`, not `failed`, so nothing alerted.
      - run: pip install "psycopg[binary]>=3.1" "pgvector>=0.3" "PyJWT[crypto]>=2.8" boto3 numpy "python-docx>=1.1" pytest pytest-cov
      - run: python -m pytest -v
