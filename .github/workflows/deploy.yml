name: Deploy FieldSight TEST (SAM)

# ============================================================
# develop → TEST stack (fieldsight-test) via full SAM deploy.
#
# PROD is NOT deployed by SAM: the prod backend was hand-assembled
# (shared IAM role, EventBridge Scheduler crons, manual API Gateway —
# no CloudFormation stack), so `sam deploy` would collide with it.
# Prod code updates are handled by deploy-prod-code.yml instead.
# ============================================================
# Canonical template: src/template.yaml (built with base_dir "." via samconfig).
# All env params are passed explicitly so a TEST deploy can never touch PROD data.
# ============================================================


# Only one deploy against a stack at a time. CloudFormation rejects an update
# while one is in flight ("Stack is in UPDATE_IN_PROGRESS"), and the run fails
# for a reason that has nothing to do with the change being deployed — which is
# how a perfectly good deploy gets diagnosed as broken code. Merging a few PRs
# in quick succession, or two people merging at once, is enough to trigger it.
#
# cancel-in-progress is deliberately FALSE: queueing is the point. Cancelling a
# run mid-CloudFormation-update would leave the stack half-applied, which is
# strictly worse than waiting.
concurrency:
  group: deploy-test
  cancel-in-progress: false

on:
  workflow_dispatch:        # manual "Run workflow" button (Actions tab, after merge)
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'ui/**'          # UI is deployed by Amplify (amplify.yml), not SAM
      - 'frontend/**'    # legacy frontend, not deployed here

permissions:
  id-token: write   # OIDC → AWS, no stored keys
  contents: read

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/setup-sam@v2
        with: { use-installer: true }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }  # must match Lambda runtime: PsycopgLayer BuildMethod python3.11 needs a 3.11 binary

      - name: SAM validate
        run: sam validate --template-file src/template.yaml --lint --region ${{ env.AWS_REGION }}

      - name: SAM build
        run: sam build --template-file src/template.yaml --base-dir .

      - name: SAM deploy (TEST)
        env:
          REALPTT_ACCOUNT: ${{ secrets.REALPTT_ACCOUNT }}
          REALPTT_PASSWORD: ${{ secrets.REALPTT_PASSWORD }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FARGATE_SUBNET_IDS: ${{ secrets.FARGATE_SUBNET_IDS }}
          FARGATE_VPC_ID: ${{ secrets.FARGATE_VPC_ID }}
        run: |
          # A space inside any --parameter-overrides "Key=Value" breaks SAM's parser.
          # Trim the VPC id; normalize the subnet list (space- OR comma-separated) to clean commas.
          VPC="$(echo "$FARGATE_VPC_ID" | xargs)"
          SUBNETS="$(echo "$FARGATE_SUBNET_IDS" | tr ',' ' ' | xargs | tr ' ' ',')"
          # DB secret ARN: read from the db stack's export; passed as a plain
          # parameter because {{resolve:secretsmanager:...}} can't compose
          # with Fn::ImportValue (only with Parameters).
          DB_SECRET_ARN="$(aws cloudformation list-exports --query "Exports[?Name=='fieldsight-db-test-SecretArn'].Value" --output text)"
          # KEYFRAME FEATURE (H-1) — activating it on TEST needs BOTH repo vars set:
          #   * TEST_KEYFRAME_FFMPEG_LAYER_ARN -> the ffmpeg layer ARN
          #     (KeyframeFfmpegLayerArn below). Intended value:
          #     arn:aws:lambda:ap-southeast-2:509194952652:layer:sitesync-vad-layer:2
          #     — a runtime-agnostic layer (CompatibleRuntimes [python3.11, python3.12])
          #     bundling /opt/bin/ffmpeg, so it loads on the 3.11 KeyframeFunction next to
          #     the cp311-only PsycopgLayer. This flips HasKeyframeFfmpegLayer ->
          #     HasKeyframeStack true so KeyframeFunction is actually CREATED on TEST and
          #     the feature can be verified BEFORE prod. Unset => empty => keyframe stack
          #     stays uncreated (today's behavior, merge-safe). NOTE: distinct from
          #     TEST_VAD_LAYER_ARN (the cp312-only fieldsight-vad-layer that feeds
          #     VadFunction) — do not conflate the two.
          #   * TEST_ENABLE_KEYFRAMES -> gates item-writer's keyframe_requests/ EMISSION.
          #     Left default false so merging does NOT auto-enable emission; flip it
          #     deliberately only after the created stack + its IAM are verified on TEST.
          # SAM's --parameter-overrides REJECTS a bare "Key=" with an empty value, so the
          # ffmpeg-layer override is only appended when the var is actually set; unset =>
          # the token is omitted and the template Default ('') keeps the stack uncreated.
          # OrgApiReservedConcurrency: test and prod are separate stacks in the SAME
          # account, so both reservations come out of the one 1000-slot pool. TEST
          # carries no customer traffic, so it takes a token slice (25) and leaves
          # prod's 200 intact. (Comments cannot live inside the --parameter-overrides
          # continuation below: a '#' after a line-continuation backslash comments out
          # the REST of the command.)
          KF_LAYER_PARAM=""
          if [ -n "${{ vars.TEST_KEYFRAME_FFMPEG_LAYER_ARN }}" ]; then
            KF_LAYER_PARAM="KeyframeFfmpegLayerArn=${{ vars.TEST_KEYFRAME_FFMPEG_LAYER_ARN }}"
          fi
          # VAD (cp312 fieldsight-vad-layer) — same bare-"Key=" guard as the keyframe
          # layer: append VadLayerArn only when TEST_VAD_LAYER_ARN is set, else the
          # template Default ('') leaves VadFunction uncreated. Without VAD, raw audio
          # under users/**.wav is never segmented and so never transcribed — the voice
          # pipeline stalls before transcripts (TEST previously had no VAD wired at all).
          VAD_LAYER_PARAM=""
          if [ -n "${{ vars.TEST_VAD_LAYER_ARN }}" ]; then
            VAD_LAYER_PARAM="VadLayerArn=${{ vars.TEST_VAD_LAYER_ARN }}"
          fi
          # Non-work (personal) topic retention sweep. Two independent gates, both
          # off by default, because this one DELETES: it tombstones the topic and
          # drops its vectors (the transcript and audio are left alone).
          #   * TEST_NONWORK_EXPIRY_ENABLED -> arms the schedule at all.
          #   * TEST_NONWORK_EXPIRY_SINCE   -> the floor. Only topics created at or
          #     after it are ever swept, so switching this on is NOT retroactive.
          #     Set it to the date the policy starts, NOT to when classification
          #     began: the earlier date would sweep every historical personal
          #     topic on the first run. The sweep refuses to run without it, so a
          #     forgotten value fails closed rather than sweeping everything.
          # Same bare-"Key=" guard as the layer overrides above.
          # AuthorityFlip mirrors PROD_AUTHORITY_FLIP: passed so test CAN match
          # prod, defaulted off so today's behaviour is unchanged. Prod runs it
          # true, so anything test proves about topic authority only transfers
          # once this is on as well.
          #
          # Explanations live HERE, above the command. A comment between two
          # backslash-continued lines ENDS the command: everything from the #
          # onward is comment, the remaining argument lines are then parsed as
          # separate commands, and the step dies with "command not found" AFTER
          # sam deploy has already run — taking the migration step with it.
          NONWORK_SINCE_PARAM=""
          if [ -n "${{ vars.TEST_NONWORK_EXPIRY_SINCE }}" ]; then
            NONWORK_SINCE_PARAM="NonWorkExpirySince=${{ vars.TEST_NONWORK_EXPIRY_SINCE }}"
          fi
          sam deploy --config-env test \
            --no-confirm-changeset --no-fail-on-empty-changeset \
            --parameter-overrides \
              "Stage=test" \
              "DataBucketName=fieldsight-data-test-509194952652" \
              "IngestBucketName=fieldsight-data-test-509194952652" \
              "EnableSchedules=false" \
              "OrgApiReservedConcurrency=25" \
              "NotionToken=${{ secrets.NOTION_TOKEN }}" \
              "NotionDataSource=${{ vars.DEVICE_LEDGER_DATA_SOURCE }}" \
              "DeviceLedgerUrl=${{ vars.DEVICE_LEDGER_URL }}" \
              "QuietAlertWorkingDays=${{ vars.QUIET_ALERT_WORKING_DAYS || '7' }}" \
              "EnableFinalize=${{ vars.TEST_ENABLE_FINALIZE || 'true' }}" \
              "EmailSender=${{ vars.TEST_EMAIL_SENDER || 'stub' }}" \
              "EnableSiteVoice=true" \
              "DocxLayerArn=arn:aws:lambda:ap-southeast-2:509194952652:layer:python-docx-layer:2" \
              "EnableNonWorkExpiry=${{ vars.TEST_NONWORK_EXPIRY_ENABLED || 'false' }}" \
              "NonWorkExpiryHours=${{ vars.TEST_NONWORK_EXPIRY_HOURS || '24' }}" \
              $NONWORK_SINCE_PARAM \
              "EnableKeyframes=${{ vars.TEST_ENABLE_KEYFRAMES || 'false' }}" \
              "EnableThreadSuggestions=${{ vars.TEST_ENABLE_THREAD_SUGGESTIONS || 'true' }}" \
              $KF_LAYER_PARAM \
              $VAD_LAYER_PARAM \
              "ItemsTableName=fieldsight-test-items" \
              "ReportsTableName=fieldsight-test-reports" \
              "AuditTableName=fieldsight-test-audit" \
              "AuthorityFlip=${{ vars.TEST_AUTHORITY_FLIP || 'false' }}" \
              "GradedRoles=${{ vars.TEST_GRADED_ROLES || 'false' }}" \
              "ServerBuild=${{ github.sha }}" \
              "DeviceAnnouncementPatterns=${{ vars.TEST_DEVICE_ANNOUNCEMENT_PATTERNS || '[]' }}" \
              "MultiTenantResolution=${{ vars.TEST_MULTI_TENANT_RESOLUTION || 'true' }}" \
              "VadThreshold=${{ vars.TEST_VAD_THRESHOLD || '0.2' }}" \
              "DropSilentChunks=${{ vars.TEST_DROP_SILENT_CHUNKS || 'true' }}" \
              "NormaliseAudio=${{ vars.TEST_NORMALISE_AUDIO || 'true' }}" \
              "FilterAudioEventTags=${{ vars.TEST_FILTER_AUDIO_EVENT_TAGS || 'true' }}" \
              "EnableGroupMerge=${{ vars.TEST_ENABLE_GROUP_MERGE || 'true' }}" \
              "RealPTTAccount=$REALPTT_ACCOUNT" \
              "RealPTTPassword=$REALPTT_PASSWORD" \
              "ClaudeApiKey=$CLAUDE_API_KEY" \
              "DashScopeApiKey=$DASHSCOPE_API_KEY" \
              "FargateSubnetIds=$SUBNETS" \
              "FargateVpcId=$VPC" \
              "DbStackName=fieldsight-db-test" \
              "DbSubnetIds=subnet-082dd4480f7e20014,subnet-08b15b36113e542d4,subnet-05fb05613cf529121" \
              "DbSecretArn=$DB_SECRET_ARN" \
              "OrgUserPoolId=ap-southeast-2_q88pd6XXr" \
              "LlmProvider=${{ vars.TEST_LLM_PROVIDER || 'qwen' }}" \
              "AsrProvider=${{ vars.TEST_ASR_PROVIDER || 'elevenlabs' }}" \
              "ElevenLabsApiKey=$ELEVENLABS_API_KEY" \
              "PgDatabase=fieldsight_test"

      - name: Apply DB migrations (invoke MigrateFunction, TEST)
        # Idempotent: db/migrate.py only applies files not already recorded in
        # the schema_migrations table, so re-running on every deploy is a no-op
        # once caught up. Runs AFTER sam deploy so the function code is current.
        run: |
          set -e
          RESP="$(aws lambda invoke --function-name fieldsight-test-migrate \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            /tmp/migrate-out.json --region ${{ env.AWS_REGION }})"
          echo "invoke meta: $RESP"
          echo "payload:"; cat /tmp/migrate-out.json; echo
          if echo "$RESP" | grep -q '"FunctionError"'; then
            echo "::error::MigrateFunction raised — see payload above"; exit 1
          fi

      - name: Wire S3 events (TEST bucket)
        run: bash scripts/wire-s3-events.sh fieldsight-data-test-509194952652 test ${{ env.AWS_REGION }} --apply

      - name: Wire bucket CORS (TEST bucket, org-assets uploads)
        run: bash scripts/wire-bucket-cors.sh fieldsight-data-test-509194952652 ${{ env.AWS_REGION }}

      - name: Wire bucket lifecycle (TEST bucket, expire abandoned pending uploads)
        run: bash scripts/wire-bucket-lifecycle.sh fieldsight-data-test-509194952652 ${{ env.AWS_REGION }}

      - name: Smoke test /api/health (TEST)
        run: bash scripts/smoke-test.sh fieldsight-test ${{ env.AWS_REGION }}

      - name: Site Voice WS smoke (TEST, best-effort)
        # Runs only if a member idToken + site are provisioned as repo secrets;
        # skips cleanly (exit 0) otherwise so the deploy never fails on absence.
        env:
          VOICE_SMOKE_TOKEN: ${{ secrets.VOICE_SMOKE_TOKEN }}
          VOICE_SMOKE_SITE: ${{ secrets.VOICE_SMOKE_SITE }}
          VOICE_SMOKE_TOKEN2: ${{ secrets.VOICE_SMOKE_TOKEN2 }}
        run: bash scripts/voice-ws-smoke.sh fieldsight-test ${{ env.AWS_REGION }}
