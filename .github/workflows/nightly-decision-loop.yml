# Site decision loop P0 engineering gate (spec docs/superpowers/specs/2026-11-05-site-decision-loop-design.md §12):
# the replay judge, the SQL invariants and the mutation gate, plus the scan's own
# integration tests, every night against a fresh Postgres.
# "No answer counted twice" cannot be exercised until P1 (spec §12).
# 15:00 UTC = 03:00/04:00 NZ. Same Postgres service, env and dependency list as test.yml.
name: Nightly decision loop
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  decision-loop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fieldsight
          POSTGRES_PASSWORD: fieldsight
          POSTGRES_DB: fieldsight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldsight"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fieldsight:fieldsight@localhost:5432/fieldsight_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -v tests/integration/test_decision_replay.py tests/integration/test_decision_mutations.py tests/integration/test_decision_scan.py
