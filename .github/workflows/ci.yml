name: CI (PR validation)

# Lints the SAM template on every PR to develop/main. No AWS credentials needed.
on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'ui/**'
      - 'frontend/**'

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install cfn-lint
        # PINNED. cfn-lint 1.54.0 (2026-08-05) started rejecting this template's
        # CognitoAuthorizer, reading `UserPoolArn:` as a Lambda authorizer and
        # demanding FunctionArn. The list form is valid SAM — it is how an
        # authorizer trusts more than one pool, which is exactly what this stack
        # does (its own pool plus the shared org pool). 1.53.3 is the last release
        # that accepts it.
        #
        # Unpinned, a lint release breaks every open PR at once with a failure
        # that points at a template nobody touched — which is how this was found.
        # Retry a newer version deliberately; do not drop the pin to "get green".
        run: pip install 'cfn-lint==1.53.3'
      - name: Lint CloudFormation templates (SAM transform + plain CFN)
        # TO RUN THIS LOCALLY, RUN THIS LINE. Not a paraphrase of it:
        #   cfn-lint src/template.yaml infra/db-template.yaml
        # at the version pinned above, and read cfn-lint's OWN exit code.
        # Three ways a local run has passed while saying nothing:
        #   * a different version -- 1.22.3 accepts what 1.53.3 rejects;
        #   * `template.yaml` -- there is no template at the repo root, and the
        #     E0003 "could not be processed by glob.glob" that you get instead
        #     looks like a finding about the template rather than about the path;
        #   * `cfn-lint ... | tail` -- the pipeline's exit code belongs to
        #     `tail`, which always succeeds. Use `set -o pipefail` or no pipe.
        # And lint BOTH templates: the second one is a plain CFN stack that the
        # SAM transform never touches, so the first file passing says nothing
        # about it.
        run: cfn-lint src/template.yaml infra/db-template.yaml
